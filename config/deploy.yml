service: semi
image: jiangplus/semi

servers:
  web:
    - sg.sola.day

# Cloudflare terminates TLS — set CF SSL/TLS mode to "Full" so CF→origin is encrypted.
proxy:
  ssl: true
  host: api.semi.im

registry:
  server: ghcr.io
  username: jiangplus
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - SECRET_KEY_BASE
    - DATABASE_URL
    - RESEND_KEY
    - ACCESS_KEY_ID
    - ACCESS_KEY_SECRET
    - ADMIN_KEY
    - ALIYUN_SMS_SIGN_NAME
    - ALIYUN_SMS_TEMPLATE_CODE
    - TENCENT_SMS_SECRET_ID
    - TENCENT_SMS_SECRET_KEY
  clear:
    SMS_ENABLED: "ENABLED"
    SOLID_QUEUE_IN_PUMA: true

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell:   app exec --interactive --reuse "bash"
  logs:    app logs -f
  dbc:     app exec --interactive --reuse "bin/rails dbconsole"

volumes:
  - "semi_storage:/rails/storage"

builder:
  arch: amd64
  remote: ssh://ubuntu@wamo.city
