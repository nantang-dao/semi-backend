# semi-backend —— 2026-08-02 从 sg.sola.day 迁到 homepod。
# 镜像仓库从 ghcr.io 换成自建的 yatch（registry.sola.day）。

service: semi-backend
image: registry.sola.day/sola/semi-backend

runner: nomad
egress: traefik

servers:
  web:
    hosts: [homepod.sola.day]
    primary: true

# 自建 registry（yatch）。2026-08-02 起不再经 ghcr。
registry:
  server: registry.sola.day
  username: sola
  password: YATCH_TOKEN

proxy:
  hosts: [api.semi.im]
  app_port: 3000
  ssl: true
  health_check_path: /up
  deploy_timeout: 90

ssh:
  user: ubuntu                # homepod 上 ubuntu 在 docker 组，且能直接调 Nomad

builder:
  arch: amd64
  remote: ssh://ubuntu@homepod

secrets:
  load: [.env.production]
  inject:
    - YATCH_TOKEN
    - DATABASE_URL
    - SECRET_KEY_BASE
    - SMS_ENABLED
    - ALIYUN_SMS_SIGN_NAME
    - ALIYUN_SMS_TEMPLATE_CODE
    - ACCESS_KEY_ID
    - ACCESS_KEY_SECRET
    - TENCENT_SMS_SECRET_ID
    - TENCENT_SMS_SECRET_KEY
    - RESEND_KEY
    - ADMIN_KEY
    - ALCHEMY_API_KEY

retain_containers: 3
